<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TPK - Tamilar Puratchi Kalakam</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:sans-serif;overflow-x:hidden;width:100%}
.header{text-align:center;padding:15px 10px}
.logo{width:125px;height:125px;margin:0 auto 12px;border-radius:50%;overflow:hidden;border:4px solid #FFD700}
.kodi{width:95%;max-width:360px;height:200px;margin:0 auto 12px;border:3px solid #FFD700;border-radius:10px;overflow:hidden}
.kodi img,.logo img{width:100%;height:100%;object-fit:cover}
.title{color:#FFD700;font-size:20px;font-weight:800}
.office{font-size:11px;color:#aaa;margin-top:8px}
.nav{display:flex;gap:8px;justify-content:center;padding:12px;background:#111;flex-wrap:wrap}
.btn{padding:11px 16px;border:none;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer}
.btn-r{background:#D90429;color:#fff}
.btn-y{background:#FFD700;color:#000}
.btn-o{background:#222;border:2px solid #FFD700;color:#fff}
.card{background:#fff;color:#000;border-radius:16px;border:3px solid #FFD700;overflow:hidden;margin:10px}
.head{background:#000;color:#FFD700;padding:12px;text-align:center;font-size:14px}
.form{padding:12px}
label{font-weight:700;font-size:12px;display:block;margin-top:8px}
input{width:100%;padding:11px;border:2px solid #ddd;border-radius:8px;margin-top:4px;box-sizing:border-box;font-size:13px}
.reg{width:100%;background:#D90429;color:#fff;padding:13px;border:none;border-radius:10px;font-weight:800;margin-top:12px;cursor:pointer}
.member-item{background:#111;border:1px solid #333;border-left:4px solid #FFD700;padding:10px;margin:8px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.member-item b{color:#FFD700;font-size:13px}
.del-btn{background:#D90429;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-weight:700;cursor:pointer;margin-left:8px}
.edit-badge{background:#FFD700;color:#000;padding:2px 6px;border-radius:4px;font-size:10px;margin-left:6px}
</style>
</head>
<body>
<div class="header">
<div class="logo"><img src="tpk_logo.png"></div>
<div class="kodi"><img src="tpk_kodi.jpg"></div>
<div class="title">TAMILAR PURATCHI KALAKAM</div>
<p style="color:#FFD700;font-size:13px">Tamilnadu</p>
<p class="office">Office: 35, Aruppukottai, Virudhunagar Dist - 626101</p>
</div>
<div class="nav">
<button class="btn btn-r" onclick="show('reg')">📝 NEW REG</button>
<button class="btn btn-y" onclick="show('members')">👥 MEMBERS (<span id="count">0</span>)</button>
<button class="btn btn-o" onclick="show('admin')">🔐 ADMIN</button>
</div>
<div id="regSec">
<div class="card">
<div class="head">உறுப்பினர் பதிவு - MEMBER REGISTRATION</div>
<div class="form">
<label>Member Photo *</label><input type="file" id="photoFile" accept="image/*">
<label>பெயர் / Name *</label><input id="name" placeholder="A.VELMURUGAN">
<label>போன் நம்பர் / Phone *</label><input id="phone" type="tel" placeholder="8489247911">
<label>Blood Group</label><input id="bg" placeholder="O+">
<label>மாவட்டம் / District *</label><input id="dist" placeholder="Virudhunagar">
<label>தொகுதி / Thoguthi *</label><input id="thog" placeholder="Aruppukottai">
<label>Address</label><input id="addr" placeholder="35,k.p.street">
<button class="reg" onclick="register()">REGISTER & DOWNLOAD CARD</button>
<div id="msg" style="margin-top:10px;font-size:12px;text-align:center"></div>
</div>
</div>
</div>
<div id="membersSec" style="display:none">
<div class="card">
<div class="head">👥 Members List - Delete Option</div>
<div id="membersList" style="padding:10px;max-height:70vh;overflow-y:auto"></div>
</div>
</div>
<div id="adminSec" style="display:none">
<div class="card">
<div class="head">ADMIN PANEL</div>
<div class="form">
<label>Password</label><input type="password" id="adminPass" placeholder="tpk2024">
<button class="reg" onclick="adminLogin()">LOGIN & VIEW ALL + DELETE</button>
<div id="adminData" style="display:none;margin-top:12px"></div>
</div>
</div>
</div>
<script>
let members = JSON.parse(localStorage.getItem('tpk_members_v2')||'[]');
updateCount();
function show(s){
document.getElementById('regSec').style.display=s=='reg'?'block':'none';
document.getElementById('membersSec').style.display=s=='members'?'block':'none';
document.getElementById('adminSec').style.display=s=='admin'?'block':'none';
if(s=='members') loadMembers(false);
}
function register(){
let name=document.getElementById('name').value.trim();
let phone=document.getElementById('phone').value.trim().replace(/\s/g,'');
let dist=document.getElementById('dist').value.trim()||'Virudhunagar';
let thog=document.getElementById('thog').value.trim();
let bg=document.getElementById('bg').value.trim();
let addr=document.getElementById('addr').value.trim();
if(!name||!phone){alert('Name & Phone Required!');return}
let dupIndex = members.findIndex(m=>m.phone==phone);
if(dupIndex!=-1){
  let old = members[dupIndex];
  if(confirm('⚠️ Phone '+phone+' already registered! Name: '+old.name+' ID: '+old.id+'\n\nDelete old & add new? OK=Delete, Cancel=Keep old')){
    members.splice(dupIndex,1);
  }else{
    document.getElementById('msg').innerHTML='<span style=color:orange>⚠️ Already Exists - ID: '+old.id+'</span>';
    return;
  }
}
let id='TPK'+Date.now().toString().slice(-6);
let data={name,phone,dist,thog,bg,addr,id,date:new Date().toLocaleDateString(),timestamp:Date.now()};
members.push(data);
localStorage.setItem('tpk_members_v2',JSON.stringify(members));
updateCount();
document.getElementById('msg').innerHTML='<span style=color:green>✅ Registered! ID: '+id+'</span>';
downloadCard(data);
}
function updateCount(){document.getElementById('count').innerText=members.length;}
function loadMembers(isAdmin){
let target = isAdmin ? document.getElementById('adminData') : document.getElementById('membersList');
if(isAdmin) document.getElementById('adminData').style.display='block';
if(members.length==0){target.innerHTML='<p style=color:#aaa;padding:10px>No members yet</p>';return}
let html = members.map((m,i)=>{
  let dupCount = members.filter(x=>x.phone==m.phone).length;
  let dupBadge = dupCount>1 ? '<span class=edit-badge>DUPLICATE '+dupCount+'x</span>' : '';
  return `<div class=member-item>
  <div style=flex:1><b>${m.name}</b> ${dupBadge}<br><small style=color:#ccc>${m.phone} | ${m.dist} | ${m.id}</small><br><small style=color:#888>${m.date}</small></div>
  <div><button class=del-btn onclick="deleteMember(${i},${isAdmin})">🗑️ DELETE</button></div>
</div>`;
}).join('');
if(isAdmin){
  target.innerHTML = '<h4 style=color:#FFD700>Total: '+members.length+'</h4><div style=margin-top:10px>'+html+'</div><button class=reg style=background:#000;border:2px solid #FFD700;color:#FFD700;margin-top:15px onclick="clearAll()">DELETE ALL MEMBERS</button>';
}else{
  target.innerHTML=html;
}
}
function deleteMember(index,isAdmin){
let m=members[index];
if(confirm('🗑️ Delete? Name: '+m.name+' Phone: '+m.phone+' ID: '+m.id)){
  members.splice(index,1);
  localStorage.setItem('tpk_members_v2',JSON.stringify(members));
  updateCount();
  loadMembers(isAdmin);
  if(isAdmin) loadMembers(true);
  alert('✅ Deleted!');
}
}
function adminLogin(){
if(document.getElementById('adminPass').value=='tpk2024'){loadMembers(true);}else alert('Wrong Password! Use: tpk2024');
}
function clearAll(){
if(confirm('ALL MEMBERS DELETE?') && confirm('LAST CONFIRM - All '+members.length+' delete?')){
   members=[];localStorage.setItem('tpk_members_v2','[]');updateCount();loadMembers(true);loadMembers(false);alert('All Deleted');
}
}
function downloadCard(m){
let c=document.createElement('canvas');c.width=800;c.height=480;
let x=c.getContext('2d');
x.fillStyle='#D90429';x.fillRect(0,0,800,180);
x.fillStyle='#FFD700';x.fillRect(0,180,800,300);
x.fillStyle='#fff';x.font='bold 32px sans-serif';x.fillText('TAMILAR PURATCHI KALAKAM',110,70);
x.fillStyle='#000';x.font='bold 20px sans-serif';
x.fillText('Name: '+m.name,40,230);
x.fillText('Phone: '+m.phone,40,265);
x.fillText('District: '+m.dist,40,300);
x.fillText('Thoguthi: '+(m.thog||''),40,335);
x.fillText('ID: '+m.id,40,370);
let a=document.createElement('a');a.download=m.name+'_TPK.png';a.href=c.toDataURL();a.click();
}
</script>
</body>
</html>
