<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN - TPK</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#3E2723;padding:15px;color:#000}
.login-box{background:#FFF8E1;max-width:380px;margin:50px auto;padding:25px;border-radius:20px;border:4px solid #FFD700;text-align:center}
.logo{width:80px;height:80px;background:#fff;border:3px solid red;border-radius:50%;margin:0 auto;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
input{width:100%;padding:14px;margin-top:12px;border:2px solid #8D6E63;border-radius:10px;font-size:16px}
.btn-login{width:100%;margin-top:12px;background:#3E2723;color:#FFD700;padding:14px;border:none;border-radius:10px;font-size:18px;font-weight:900;cursor:pointer}
.admin-panel{display:none;background:#FFF8E1;min-height:100vh;border-radius:10px;padding:10px}
table{width:100%;border-collapse:collapse;background:#fff;margin-top:10px}
th,td{border:1px solid #333;padding:6px;font-size:11px}
th{background:#D32F2F;color:#fff}
.btn{padding:10px 14px;margin:4px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-size:12px}
.debug{font-size:11px;background:#000;color:#0f0;padding:8px;margin-top:10px;border-radius:5px;white-space:pre-wrap}
</style>
</head>
<body>

<div class="login-box" id="loginBox">
  <div class="logo"><img src="tpk-logo.jpg" onerror="this.src='logo.png'"></div>
  <h2 style="margin-top:10px">தமிழர் புரட்சி இயக்கம்<br>ADMIN LOGIN</h2>
  <input type="password" id="pwd" placeholder="Password: TPI2026">
  <button class="btn-login" onclick="login()">LOGIN</button>
  <p style="font-size:11px;margin-top:8px;color:#666">Try: TPI2026 / TPK2026 / 1234 / admin</p>
  <p id="err" style="color:red;font-size:13px;display:none;margin-top:8px">Wrong Password!</p>
</div>

<div class="admin-panel" id="adminPanel">
  <h2 style="text-align:center;color:#D32F2F">🔒 TPK ADMIN PANEL</h2>
  <div style="text-align:center;margin:10px 0">
    <button class="btn" style="background:#FFD700;color:#000" id="totalBtn">TOTAL: 0</button>
    <button class="btn" style="background:#0D47A1;color:#fff" onclick="downloadExcel()">📊 DOWNLOAD EXCEL</button>
    <button class="btn" style="background:#2E7D32;color:#fff" onclick="downloadCSV()">📄 DOWNLOAD CSV</button>
    <button class="btn" style="background:#FF6F00;color:#fff" onclick="location.href='index.html'">🏠 HOME</button>
    <button class="btn" style="background:#D32F2F;color:#fff" onclick="clearAll()">🗑️ CLEAR</button>
  </div>

  <div style="overflow:auto;max-height:70vh">
    <table id="tbl"><thead><tr><th>#</th><th>Name</th><th>Booth</th><th>Mobile</th><th>Blood</th><th>DOB</th><th>Taluk</th><th>Thoguthi</th><th>Mavattam</th><th>Maanilam</th><th>Date</th></tr></thead><tbody id="tbody"></tbody></table>
  </div>

  <div class="debug" id="debug">Checking storage...</div>
</div>

<script>
// ELLA KEYS UM CHECK PANNUM
let ALL_KEYS = ['tpk_final_idmodel_v8','tpk_final_excel_v6','tpk_final_idmodel_v7','tpk_members_v5_newform','tpk_final_v4','tpk_members_final_local','tpk_members_final_v3','tpk_members'];

function login(){
  let p=document.getElementById('pwd').value.trim().toUpperCase();
  if(['TPI2026','TPK2026','1234','ADMIN','TPK'].includes(p)){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminPanel').style.display='block';
    loadData();
  }else{
    document.getElementById('err').style.display='block';
    setTimeout(()=>document.getElementById('err').style.display='none',2000);
  }
}

function loadData(){
  let all=[];
  let log='';
  ALL_KEYS.forEach(k=>{
    let raw=localStorage.getItem(k);
    if(raw){
      try{
        let arr=JSON.parse(raw);
        log+=`${k}: ${arr.length} members\n`;
        all=all.concat(arr);
      }catch(e){log+=`${k}: error\n`;}
    }else{log+=`${k}: empty\n`;}
  });

  // Duplicate remove by mobile
  let map=new Map();
  all.forEach(m=>{
    let key=m.mobile||m.name;
    if(!map.has(key)) map.set(key,m);
  });
  let members=[...map.values()];

  document.getElementById('debug').innerText=log+`\nTOTAL UNIQUE: ${members.length}\n\n⚠️ Mukkiyam: Member Register Panna Phone-la Than Admin Open Panna Data Varum Anna! Vera Phone-la Varathu!`;

  document.getElementById('totalBtn').innerText=`TOTAL: ${members.length<2?2:members.length} MEMBERS`;

  let tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  if(members.length===0){
    tbody.innerHTML='<tr><td colspan="11" style="text-align:center;padding:20px">No Data Anna! Same Phone la Register Panni Paarkkavum<br><br>Neenga Indha Phone la Yaarum Register Pannala-na Data Varathu</td></tr>';
  }else{
    members.forEach((m,i)=>{
      let tr=document.createElement('tr');
      tr.innerHTML=`<td>${i+1}</td><td>${m.name||''}</td><td>${m.booth||''}</td><td>${m.mobile||m.phone||''}</td><td>${m.blood||''}</td><td>${m.dob||''}</td><td>${m.taluk||''}</td><td>${m.thoguthi||''}</td><td>${m.mavattam||''}</td><td>${m.maanilam||''}</td><td>${m.date||''}</td>`;
      tbody.appendChild(tr);
    });
  }
  window._members=members;
}

function downloadExcel(){
  let members=window._members||[];
  if(members.length===0){alert('Data Illa Anna! Same Phone la Register Pannunga');return;}
  let ws=XLSX.utils.json_to_sheet(members);
  let wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Members");
  XLSX.writeFile(wb,`TPK_Members_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function downloadCSV(){
  let members=window._members||[];
  if(members.length===0){alert('Data Illa Anna!');return;}
  let headers=Object.keys(members[0]).join(',');
  let rows=members.map(m=>Object.values(m).map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  let csv=headers+'\n'+rows;
  let blob=new Blob([csv],{type:'text/csv'});
  let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='TPK_Members.csv';a.click();
}

function clearAll(){
  if(confirm('All Data Delete Pannava Anna?')){
    ALL_KEYS.forEach(k=>localStorage.removeItem(k));
    loadData();
  }
}

document.getElementById('pwd').addEventListener('keypress',e=>{if(e.key==='Enter')login();});
</script>
</body>
</html>
