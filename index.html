<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPK - Tamilar Puratchi Kalakam</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-black">
<div class="max-w-md mx-auto bg-white min-h-screen">

<!-- FIXED HEADER - YOUR LOGO & FLAG -->
<div class="bg-black text-center p-3 border-b-4 border-yellow-400">
<img src="tpk-logo.jpg?v=2" class="w-28 h-28 mx-auto rounded-full border-4 border-yellow-400 object-cover bg-white">
<h1 class="text-yellow-400 font-black mt-2 text-lg">TAMILAR PURATCHI KALAKAM</h1>
<p class="text-gray-400 text-[11px]">38 DISTRICTS • 234 THOGUTHIS • 35, Aruppukottai</p>
<div class="flex justify-center gap-2 mt-2">
<div class="bg-yellow-400 text-black px-3 py-1 rounded-full text-xs font-bold">TOTAL: <span id="totalCount">0</span></div>
<button onclick="openAdminLogin()" class="bg-red-600 text-white px-4 py-1 rounded-full text-xs font-black">🔐 ADMIN</button>
</div>
<img src="tpk-flag.jpg?v=2" class="w-full h-28 object-cover mt-3 rounded-lg border-2 border-yellow-400">
</div>

<div id="publicView" class="p-4">
<h2 class="text-center font-black text-red-600 mb-3">📝 NEW MEMBER REGISTRATION</h2>

<div class="border-2 border-yellow-400 rounded-xl p-3 bg-yellow-50 mb-3">
<label class="text-xs font-bold">📸 Photo *</label>
<input id="camIn" type="file" accept="image/*" capture="environment" class="hidden">
<input id="galIn" type="file" accept="image/*" class="hidden">
<div class="flex gap-2 mt-2">
<button onclick="document.getElementById('camIn').click()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold">📷 CAMERA</button>
<button onclick="document.getElementById('galIn').click()" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold">🖼️ GALLERY</button>
</div>
<div id="photoDiv" class="hidden mt-2 text-center">
<img id="photoPrev" class="w-28 h-28 mx-auto rounded-xl border-4 border-yellow-400 object-cover">
<p class="text-xs text-green-600 font-bold">✅ Photo Ready</p>
</div>
</div>

<input id="name" placeholder="Name * / பெயர்" class="w-full border-2 p-3 rounded-lg mb-2 font-bold">
<input id="phone" placeholder="Phone * / 10 digit" type="tel" class="w-full border-2 p-3 rounded-lg mb-2">
<select id="blood" class="w-full border-2 p-3 rounded-lg mb-2 bg-white"><option value="">Blood Group *</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select>
<select id="dist" class="w-full border-2 p-3 rounded-lg mb-2 bg-white"><option value="">District *</option><option>Virudhunagar</option><option>Madurai</option><option>Chennai</option><option>Coimbatore</option><option>Trichy</option><option>Salem</option><option>Tirunelveli</option><option>Thoothukudi</option><option>Other</option></select>
<select id="thoguthi" class="w-full border-2 p-3 rounded-lg mb-2 bg-white"><option value="">Thoguthi *</option><option>Aruppukottai</option><option>Virudhunagar</option><option>Sivakasi</option><option>Sattur</option><option>Other</option></select>
<input id="booth" placeholder="Booth No" class="w-full border-2 p-3 rounded-lg mb-2">
<input id="address" placeholder="Address" class="w-full border-2 p-3 rounded-lg mb-3">

<button id="mainBtn" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-lg">🪪 REGISTER & DOWNLOAD ID CARD</button>
<p id="msg" class="text-center font-bold text-sm mt-2"></p>

<div class="mt-4 bg-yellow-50 p-2 rounded-xl border-2 border-black">
<canvas id="idCanvas" width="800" height="460" class="w-full rounded-lg"></canvas>
</div>
</div>

<div id="loginModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50"><div class="bg-white rounded-2xl p-6 w-full max-w-sm"><h3 class="font-black text-center">🔐 ADMIN LOGIN</h3><input id="adminPass" type="password" placeholder="TPK@2026" class="w-full border-2 border-black p-3 rounded-xl font-bold text-center mt-3"><button onclick="checkAdminPass()" class="w-full mt-3 bg-black text-yellow-400 py-3 rounded-xl font-black">LOGIN</button><button onclick="closeAdminLogin()" class="w-full mt-2 bg-gray-200 py-2 rounded-xl">Cancel</button><p id="loginMsg" class="text-center text-xs font-bold mt-2"></p></div></div>
<div id="adminView" class="hidden p-4 bg-gray-50 min-h-screen"><div class="flex justify-between"><h2 class="font-black">🔐 ADMIN</h2><button onclick="closeAdmin()" class="bg-black text-white px-3 py-1 rounded-full text-xs">CLOSE</button></div><div class="bg-white border-2 border-green-600 rounded-xl p-3 mt-3"><div class="grid grid-cols-2 gap-2"><button onclick="downloadExcel()" class="bg-green-600 text-white py-3 rounded-xl font-black text-sm">📥 EXCEL</button><button onclick="downloadCSV()" class="bg-blue-600 text-white py-3 rounded-xl font-black text-sm">📄 CSV</button></div><a href="https://docs.google.com/spreadsheets/d/1fkBkupoUE3ybd_JlE_fHxYsx-YtbQE5tuUnUBfduLk0/edit" target="_blank" class="block mt-2 bg-yellow-400 text-black text-center py-2 rounded-xl font-bold text-xs">📊 GOOGLE SHEET</a></div><div id="adminList" class="space-y-2 mt-3"></div></div>
</div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbxrfdA8J0kU8aNlZPOv3IXwQH6H_Afw1Qu4Li9j_hplcjLWumL8DftvTeQiwIRRyTRH/exec";
const ADMIN_PASSWORD="TPK@2026";
let photoData=""; let members=JSON.parse(localStorage.getItem('tpk_admin_final')||'[]');
document.getElementById('totalCount').textContent=members.length;
document.getElementById('camIn').addEventListener('change',e=>handlePhoto(e.target.files[0]));
document.getElementById('galIn').addEventListener('change',e=>handlePhoto(e.target.files[0]));
function handlePhoto(f){ if(!f) return; const r=new FileReader(); r.onload=e=>{photoData=e.target.result; document.getElementById('photoPrev').src=photoData; document.getElementById('photoDiv').classList.remove('hidden'); drawCard();}; r.readAsDataURL(f); }
function drawCard(){
const m={id:'TPK/'+new Date().getFullYear()+'/'+Math.floor(1000+Math.random()*9000),name:document.getElementById('name').value||'Name',booth:document.getElementById('booth').value||'--',thoguthi:document.getElementById('thoguthi').value||'Aruppukottai',dist:document.getElementById('dist').value||'Virudhunagar',photo:photoData};
const c=document.getElementById('idCanvas'); const ctx=c.getContext('2d');
ctx.fillStyle='#FFC200'; ctx.fillRect(0,0,800,460);
ctx.fillStyle='#7A0019'; ctx.font='900 30px sans-serif'; ctx.fillText('தமிழர் புரட்சி கழகம்',20,40);
ctx.font='700 12px sans-serif'; ctx.fillText('TAMILAR PURATCHI KALAKAM',20,60);
const logoImg=new Image(); logoImg.src='tpk-logo.jpg'; ctx.drawImage(logoImg,640,5,120,120);
ctx.fillStyle='#4A000F'; ctx.font='700 16px sans-serif';
ctx.fillText('பெயர்: '+m.name,20,110); ctx.fillText('பூத்: '+m.booth,20,135); ctx.fillText('தொகுதி: '+m.thoguthi,20,160); ctx.fillText('மாவட்டம்: '+m.dist,20,185);
ctx.strokeStyle='#7A0019'; ctx.strokeRect(20,230,80,80);
if(m.photo){const img=new Image(); img.onload=()=>ctx.drawImage(img,22,232,76,76); img.src=m.photo;}
ctx.fillStyle='white'; ctx.fillRect(130,230,80,80); ctx.fillStyle='black'; for(let i=0;i<8;i++) for(let j=0;j<8;j++) if(Math.random()>0.5) ctx.fillRect(135+i*9,235+j*9,6,6);
const flagImg=new Image(); flagImg.src='tpk-flag.jpg'; ctx.drawImage(flagImg,450,130,300,100);
ctx.fillStyle='#7A0019'; ctx.fillRect(0,400,800,60);
ctx.fillStyle='#FFEB3B'; ctx.font='11px Arial'; ctx.fillText('Plot 35, Aruppukottai | ID:'+m.id,15,435);
return m;
}
function downloadCanvas(n){ const c=document.getElementById('idCanvas'); const a=document.createElement('a'); a.download=n+'.png'; a.href=c.toDataURL('image/png'); a.click(); }
document.getElementById('mainBtn').addEventListener('click', async ()=>{
const name=document.getElementById('name').value.trim(); const phone=document.getElementById('phone').value.trim();
const dist=document.getElementById('dist').value; const thoguthi=document.getElementById('thoguthi').value;
const msg=document.getElementById('msg'); const btn=document.getElementById('mainBtn');
if(!name||!phone){msg.textContent='❌ Name & Phone required!'; msg.className='text-center font-bold text-sm mt-2 text-red-600'; return;}
if(!photoData){msg.textContent='❌ Photo required!'; msg.className='text-center font-bold text-sm mt-2 text-red-600'; return;}
if(!dist||!thoguthi){msg.textContent='❌ District & Thoguthi!'; msg.className='text-center font-bold text-sm mt-2 text-red-600'; return;}
btn.textContent='⏳ Saving...'; btn.disabled=true;
const memberId='TPK/'+new Date().getFullYear()+'/'+Math.floor(1000+Math.random()*9000);
drawCard();
const payload={memberId,name,fname:'',phone,blood:document.getElementById('blood').value,dist,thoguthi,address:document.getElementById('address').value,boothNo:document.getElementById('booth').value,taluk:''};
try{
await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});
members.unshift({id:memberId,name,phone,dist,thoguthi,booth:document.getElementById('booth').value,date:new Date().toLocaleString(),photo:photoData});
localStorage.setItem('tpk_admin_final',JSON.stringify(members));
document.getElementById('totalCount').textContent=members.length;
msg.textContent='✅ Registered! Downloading...'; msg.className='text-center font-bold text-sm mt-2 text-green-600';
setTimeout(()=>{downloadCanvas(memberId+'_TPK_ID'); btn.textContent='✅ DONE!'; setTimeout(()=>{btn.textContent='🪪 REGISTER & DOWNLOAD ID CARD'; btn.disabled=false;},2000);},800);
}catch(e){msg.textContent='❌ Error'; btn.disabled=false;}
});
['name','booth','thoguthi','dist'].forEach(id=>{document.getElementById(id).addEventListener('input',drawCard); document.getElementById(id).addEventListener('change',drawCard);});
drawCard();
function openAdminLogin(){document.getElementById('loginModal').classList.remove('hidden');}
function closeAdminLogin(){document.getElementById('loginModal').classList.add('hidden');}
function checkAdminPass(){ const p=document.getElementById('adminPass').value; if(p===ADMIN_PASSWORD){document.getElementById('loginModal').classList.add('hidden'); document.getElementById('publicView').classList.add('hidden'); document.getElementById('adminView').classList.remove('hidden'); renderAdmin();}else{document.getElementById('loginMsg').textContent='❌ Wrong Password!';} }
function closeAdmin(){document.getElementById('adminView').classList.add('hidden'); document.getElementById('publicView').classList.remove('hidden');}
function renderAdmin(){ const div=document.getElementById('adminList'); if(members.length===0){div.innerHTML='<p class="text-center py-10">No members</p>'; return;} div.innerHTML=members.map(m=>`<div class="bg-white border p-3 rounded-xl"><p class="font-black">${m.name}</p><p class="text-xs">${m.id} • ${m.phone}</p></div>`).join(''); }
function downloadExcel(){ if(!members.length){alert('No members!'); return;} const data=members.map(m=>({MemberID:m.id,Name:m.name,Phone:m.phone,District:m.dist,Thoguthi:m.thoguthi,Booth:m.booth,Date:m.date})); const ws=XLSX.utils.json_to_sheet(data); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'TPK'); XLSX.writeFile(wb,'TPK_Members.xlsx'); }
function downloadCSV(){ if(!members.length){alert('No members!'); return;} let csv='MemberID,Name,Phone,District,Thoguthi,Booth,Date\n'; members.forEach(m=>{csv+=`"${m.id}","${m.name}","${m.phone}","${m.dist}","${m.thoguthi}","${m.booth||''}","${m.date}"\n`;}); const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='TPK_Members.csv'; a.click(); }
</script>
</body>
</html>
