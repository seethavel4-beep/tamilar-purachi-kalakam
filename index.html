<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPK Fixed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;font-weight:bold}
body{background:#fef08a}
.header{background:#dc2626;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:6px solid #facc15}
.header img{width:65px;height:65px;border-radius:50%;border:4px solid #facc15;background:#fff;object-fit:cover}
.header h1{color:#facc15;font-size:15px;line-height:1.1;text-shadow:2px 2px 0 #000}
.form{max-width:440px;margin:12px auto;background:#fff;border:4px solid #dc2626;border-radius:18px;overflow:hidden;box-shadow:7px 7px 0 #000}
.form-head{background:#dc2626;color:#facc15;text-align:center;padding:12px;border-bottom:4px solid #facc15}
.form-body{padding:14px;background:#fffef0}
.pbox{width:120px;height:130px;margin:0 auto 10px;border:4px solid #facc15;border-radius:14px;overflow:hidden;position:relative;background:#eee}
.pbox img{width:100%;height:100%;object-fit:cover}
.pbox input{position:absolute;inset:0;opacity:0}
.inp{width:100%;padding:13px;margin:6px 0;border:3px solid #facc15;border-radius:11px;background:#fff;font-size:14px}
.btnR{width:100%;padding:16px;background:#b91c1c;color:#facc15;font-size:17px;border:3px solid #000;border-radius:12px;margin-top:10px;box-shadow:5px 5px 0 #000}
.btnD{width:100%;padding:14px;background:#facc15;color:#b91c1c;border:3px solid #000;border-radius:12px;margin-top:10px;display:none}
.cardWrap{display:none;max-width:430px;margin:16px auto}
.card{background:#fff;border:4px solid #000;border-radius:16px;overflow:hidden}
.cardTop{background:#dc2626;padding:10px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #facc15}
.cardTop img{width:52px;height:52px;border-radius:50%;border:3px solid #facc15;background:#fff}
.cardTop h2{color:#facc15;font-size:11px;text-align:center}
.cardMid{padding:14px;text-align:center;background:#fffef0}
.cPhoto{width:120px;height:135px;margin:0 auto;border:4px solid #dc2626;border-radius:12px;overflow:hidden}
.cPhoto img{width:100%;height:100%;object-fit:cover}
.details{text-align:left;margin-top:10px;background:#fff;border:3px solid #facc15;border-radius:10px;padding:10px;font-size:13px;line-height:2}
.cardBot{background:#dc2626;color:#facc15;text-align:center;padding:10px;font-size:11px;border-top:4px solid #facc15}
</style>
</head>
<body>
<div class="header"><div style="display:flex;gap:10px;align-items:center"><img src="logo.jpg"><h1>TAMILAR<br>PURATCHI<br>KALAKAM</h1></div><div style="background:#facc15;color:#dc2626;padding:5px 12px;border-radius:20px;border:2px solid #000">TPK</div></div>
<div class="form">
<div class="form-head">🔴 REGISTER - RED YELLOW 🟡</div>
<div class="form-body">
<div class="pbox"><img id="prev" src="logo.jpg"><input type="file" id="fileIn" accept="image/*"></div>
<input id="nameI" class="inp" placeholder="Name - A Velmurugan" value="A Velmurugan">
<input id="fatherI" class="inp" placeholder="Father - ANNAMALAI" value="ANNAMALAI">
<input id="phoneI" class="inp" placeholder="Phone" value="8489247911">
<select id="distI" class="inp"><option>Virudhunagar</option><option>Madurai</option></select>
<select id="talukI" class="inp"><option>Aruppukottai</option><option>Sattur</option></select>
<select id="unionI" class="inp"><option>Aruppukottai</option></select>
<select id="bloodI" class="inp"><option>O+ve</option><option>A+ve</option></select>
<input id="addrI" class="inp" placeholder="Address" value="35,K.p, street">
<button class="btnR" id="regBtn">✅ REGISTER NOW - ID CARD READY</button>
<button class="btnD" id="downloadBtn">⬇️ DOWNLOAD ID CARD</button>
</div>
</div>
<div class="cardWrap" id="cardWrap">
<div class="card"><div class="cardTop"><img src="logo.jpg"><h2>TAMILAR PURATCHI KALAKAM<br>OFFICIAL</h2><img src="logo.jpg"></div>
<div class="cardMid"><div class="cPhoto"><img id="cardPhoto"></div><div class="details"><div><b>Name:</b><span id="outName"></span></div><div><b>S/O:</b><span id="outFather"></span></div><div><b>Phone:</b><span id="outPhone"></span></div><div><b>Dist:</b><span id="outDist"></span></div><div><b>Blood:</b><span id="outBlood"></span></div><div><b>Add:</b><span id="outAddr"></span></div></div></div><div class="cardBot">TPK RED YELLOW</div></div>
</div>
<canvas id="myCanvas" style="display:none"></canvas>
<script>
var userPhotoData = "";
document.getElementById('fileIn').addEventListener('change', function(e){
 var file = e.target.files[0]; if(!file) return;
 var reader = new FileReader();
 reader.onload = function(ev){ userPhotoData = ev.target.result; document.getElementById('prev').src = userPhotoData; document.getElementById('cardPhoto').src = userPhotoData; };
 reader.readAsDataURL(file);
});
document.getElementById('regBtn').addEventListener('click', function(){
 var n = document.getElementById('nameI').value || "A Velmurugan";
 var f = document.getElementById('fatherI').value || "ANNAMALAI";
 var p = document.getElementById('phoneI').value || "8489247911";
 var d = document.getElementById('distI').value;
 var b = document.getElementById('bloodI').value;
 var a = document.getElementById('addrI').value;
 if(!userPhotoData){ userPhotoData = document.getElementById('prev').src; }
 document.getElementById('outName').innerText = n;
 document.getElementById('outFather').innerText = f;
 document.getElementById('outPhone').innerText = p;
 document.getElementById('outDist').innerText = d;
 document.getElementById('outBlood').innerText = b;
 document.getElementById('outAddr').innerText = a;
 document.getElementById('cardPhoto').src = userPhotoData;
 document.getElementById('cardWrap').style.display = "block";
 document.getElementById('downloadBtn').style.display = "block";
 document.getElementById('cardWrap').scrollIntoView({behavior: 'smooth'});
});
document.getElementById('downloadBtn').addEventListener('click', function(){
 var canvas = document.getElementById('myCanvas'); var ctx = canvas.getContext('2d'); canvas.width = 420; canvas.height = 650;
 ctx.fillStyle = "#fffef0"; ctx.fillRect(0,0,420,650);
 ctx.fillStyle = "#dc2626"; ctx.fillRect(0,0,420,85); ctx.fillStyle = "#facc15"; ctx.fillRect(0,80,420,8);
 var logoImg = new Image(); logoImg.crossOrigin = "anonymous"; logoImg.src = "logo.jpg";
 var userImg = new Image(); userImg.src = userPhotoData;
 var loaded = 0; function draw(){ loaded++; if(loaded < 2) return;
  try{ ctx.drawImage(logoImg, 10, 8, 65, 65); ctx.drawImage(logoImg, 340, 8, 65, 65); }catch(e){}
  ctx.fillStyle = "#facc15"; ctx.font = "900 14px Arial"; ctx.textAlign = "center"; ctx.fillText("TAMILAR PURATCHI KALAKAM", 210, 40);
  ctx.fillStyle = "#fff"; ctx.font = "700 9px Arial"; ctx.fillText("RED YELLOW - OFFICIAL ID", 210, 58);
  try{ ctx.drawImage(userImg, 150, 100, 120, 135); }catch(e){}
  ctx.fillStyle = "#fff"; ctx.fillRect(15, 260, 390, 320); ctx.strokeStyle = "#facc15"; ctx.lineWidth = 4; ctx.strokeRect(15, 260, 390, 320);
  function get(id){ return document.getElementById(id).innerText; }
  var y = 285; ctx.textAlign = "left"; ctx.font = "900 13px Arial";
  ctx.fillStyle = "#dc2626"; ctx.fillText("Name:", 25, y); ctx.fillStyle = "#000"; ctx.fillText(get("outName"), 90, y); y+=32;
  ctx.fillStyle = "#dc2626"; ctx.fillText("S/O:", 25, y); ctx.fillStyle = "#000"; ctx.fillText(get("outFather"), 90, y); y+=32;
  ctx.fillStyle = "#dc2626"; ctx.fillText("Phone:", 25, y); ctx.fillStyle = "#000"; ctx.fillText(get("outPhone"), 90, y); y+=32;
  ctx.fillStyle = "#dc2626"; ctx.fillText("Dist:", 25, y); ctx.fillStyle = "#000"; ctx.fillText(get("outDist"), 90, y); y+=32;
  ctx.fillStyle = "#dc2626"; ctx.fillText("Blood:", 25, y); ctx.fillStyle = "#000"; ctx.fillText(get("outBlood"), 90, y);
  ctx.fillStyle = "#dc2626"; ctx.fillRect(0, 610, 420, 40); ctx.fillStyle = "#facc15"; ctx.font = "900 11px Arial"; ctx.textAlign = "center"; ctx.fillText("TAMILAR PURATCHI KALAKAM - VIRUDHUNAGAR", 210, 635);
  var a = document.createElement('a'); a.download = "TPK_"+get("outName").replace(/ /g,"_")+".png"; a.href = canvas.toDataURL("image/png"); a.click();
 }
 logoImg.onload = draw; userImg.onload = draw; logoImg.onerror = draw; userImg.onerror = draw;
 setTimeout(draw, 1200);
});
</script>
</body>
</html>
