<style>
* {margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body {background:#fef08a;min-height:100vh}

.btn-dl {width:100%;padding:14px;background:#facc15;color:#dc2626;font-weight:900;border:3px solid #000;border-radius:14px;margin-top:10px;box-shadow:5px 5px 0px #dc2626;display:none}
.id-wrapper {display:none;max-width:410px;margin:20px auto}
.id-card {background:#fff;border:4px solid #000;border-radius:18px;overflow:hidden;box-shadow:8px 8px 0px #000}

.id-middle {padding:16px;background:#fffef0;text-align:center}
.id-photo {width:120px;height:135px;margin:0 auto;border:4px solid #dc2626;border-radius:14px;overflow:hidden}
.id-photo img {width:100%;height:100%;object-fit:cover}
.id-details {text-align:left;margin-top:12px;background:#fff;border:3px solid #facc15;border-radius:12px;padding:12px}
.id-row {display:flex;font-size:13px;font-weight:700;line-height:2;border-bottom:1px dashed #facc15}
.id-row b {width:75px;color:#dc2626}
.id-bottom {background:#dc2626;color:#facc15;text-align:center;padding:10px;font-weight:900;font-size:11px;border-top:4px solid #facc15}
</style>
</head>
