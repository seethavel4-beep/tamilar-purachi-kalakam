<script>
var TALUKS={"Ariyalur":["Ariyalur","Andimadam","Sendurai","Udayarpalayam"],"Chengalpattu":["Chengalpattu","Cheyyur","Madurantakam","Pallavaram","Tambaram","Thiruporur","Tirukalukundram","Vandalur"],"Chennai":["Alandur","Ambattur","Aminjikarai","Ayanavaram","Egmore","Guindy","Madhavaram","Maduravoyal","Mambalam","Mylapore","Perambur","Purasawalkam","Sholinganallur","Tiruvottiyur","Tondiarpet","Velachery"],"Coimbatore":["Anaimalai","Annur","Coimbatore North","Coimbatore South","Kinathukadavu","Madukkarai","Mettupalayam","Perur","Pollachi","Sulur","Valparai"],"Cuddalore":["Cuddalore","Bhuvanagiri","Chidambaram","Kattumannarkoil","Kurinjipadi","Panruti","Srimushnam","Vriddhachalam"],"Dharmapuri":["Dharmapuri","Harur","Karimangalam","Nallampalli","Palacode","Pappireddipatti","Pennagaram"],"Dindigul":["Dindigul","Athoor","Guziliamparai","Kodaikanal","Natham","Nilakottai","Oddanchatram","Palani","Vedasandur"],"Erode":["Erode","Andhiyur","Bhavani","Gobichettipalayam","Kodumudi","Modakkurichi","Perundurai","Sathyamangalam"],"Kallakurichi":["Kallakurichi","Chinnaselam","Sankarapuram","Tirukkoyilur","Ulundurpet"],"Kanchipuram":["Kanchipuram","Kundrathur","Sriperumbudur","Uthiramerur","Walajabad"],"Kanyakumari":["Agasteeswaram","Kalkulam","Killiyoor","Thiruvattar","Thovalai","Vilavancode"],"Karur":["Karur","Aravakurichi","Kulithalai","Krishnarayapuram","Manmangalam","Pugalur"],"Krishnagiri":["Krishnagiri","Bargur","Denkanikottai","Hosur","Pochampalli","Shoolagiri","Uthangarai"],"Madurai":["Madurai North","Madurai South","Madurai East","Madurai West","Melur","Peraiyur","Thirumangalam","Thirupparankundram","Usilampatti","Vadipatti"],"Mayiladuthurai":["Mayiladuthurai","Kuthalam","Sirkazhi","Tharangambadi"],"Nagapattinam":["Nagapattinam","Kilvelur","Thirukuvalai","Vedaranyam"],"Namakkal":["Namakkal","Kolli Hills","Kumarapalayam","Paramathi Velur","Rasipuram","Tiruchengode"],"Nilgiris":["Udhagamandalam","Coonoor","Gudalur","Kotagiri","Kundah","Panthalur"],"Perambalur":["Perambalur","Alathur","Kunnam","Veppanthattai","Veppur"],"Pudukkottai":["Pudukkottai","Alangudi","Aranthangi","Avudaiyarkoil","Gandarvakottai","Iluppur","Karambakkudi","Kulathur","Manamelkudi","Ponnamaravathi","Thirumayam","Viralimalai"],"Ramanathapuram":["Ramanathapuram","Kadaladi","Kamuthi","Mudukulathur","Paramakudi","Rameswaram","Tiruvadanai"],"Ranipet":["Ranipet","Arakkonam","Arcot","Kalavai","Nemili","Sholinghur","Walajah"],"Salem":["Salem","Attur","Edappadi","Gangavalli","Mettur","Omalur","Pethanaickenpalayam","Sankari","Vazhapadi","Yercaud"],"Sivagangai":["Sivagangai","Devakottai","Ilayangudi","Karaikudi","Manamadurai","Thiruppuvanam","Tiruppathur"],"Tenkasi":["Tenkasi","Alangulam","Kadayanallur","Sankarankoil","Sengottai","Sivagiri"],"Thanjavur":["Thanjavur","Kumbakonam","Orathanadu","Papanasam","Pattukkottai","Peravurani","Thiruvaiyaru","Thiruvidaimarudur"],"Theni":["Theni","Andipatti","Bodinayakanur","Periyakulam","Uthamapalayam"],"Thoothukudi":["Thoothukudi","Ettayapuram","Kovilpatti","Ottapidaram","Sathankulam","Srivaikuntam","Tiruchendur","Vilathikulam"],"Tiruchirappalli":["Tiruchirappalli West","Tiruchirappalli East","Srirangam","Lalgudi","Manachanallur","Manapparai","Musiri","Thottiyam","Thuraiyur"],"Tirunelveli":["Tirunelveli","Ambasamudram","Cheranmahadevi","Manur","Nanguneri","Palayamkottai","Radhapuram"],"Tirupathur":["Tirupathur","Ambur","Natrampalli","Vaniyambadi","Jolarpet"],"Tiruppur":["Tiruppur North","Tiruppur South","Avinashi","Dharapuram","Kangeyam","Madathukulam","Palladam","Udumalpet"],"Tiruvallur":["Tiruvallur","Avadi","Gummidipoondi","Pallipattu","Ponneri","Poonamallee","Tiruttani","Uthukottai"],"Tiruvannamalai":["Tiruvannamalai","Arani","Chengam","Chetpet","Cheyyar","Kalasapakkam","Polur","Vandavasi","Vembakkam"],"Tiruvarur":["Tiruvarur","Kodavasal","Mannargudi","Nannilam","Needamangalam","Thiruthuraipoondi","Valangaiman"],"Vellore":["Vellore","Anaicut","Katpadi","Gudiyatham","K.V.Kuppam","Pernampattu"],"Viluppuram":["Viluppuram","Gingee","Kandachipuram","Marakkanam","Tindivanam","Vanur","Vikravandi"],"Virudhunagar":["Virudhunagar","Aruppukottai","Kariapatti","Rajapalayam","Sathur","Sivakasi","Srivilliputhur","Tiruchuli"]};
var PHOTO="";var CUR=null;
function loadTaluk(){var d=document.getElementById('district').value;var s=document.getElementById('taluk');s.innerHTML='<option value="">-- SELECT TALUK --</option>';if(!d||!TALUKS[d]){s.innerHTML='<option value="">-- FIRST SELECT DISTRICT --</option>';return;}TALUKS[d].forEach(function(t){var o=document.createElement('option');o.value=t;o.text=t;s.appendChild(o);});}
function process(f,cb){var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){var c=document.createElement('canvas');var w=500;var sc=w/img.width;if(sc>1)sc=1;c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.7));};img.src=e.target.result;};r.readAsDataURL(f);}
document.getElementById('pc').addEventListener('change',function(){var f=this.files[0];if(!f)return;process(f,function(d){PHOTO=d;document.getElementById('photoPrev').classList.remove('hidden');document.getElementById('prevImg').src=d;});});
document.getElementById('pg').addEventListener('change',function(){var f=this.files[0];if(!f)return;process(f,function(d){PHOTO=d;document.getElementById('photoPrev').classList.remove('hidden');document.getElementById('prevImg').src=d;});});
function getM(){try{return JSON.parse(localStorage.getItem('tpk_members')||'[]')}catch(e){return[]}}
function saveM(a){localStorage.setItem('tpk_members',JSON.stringify(a))}
function updateCount(){document.getElementById('cnt').textContent=getM().length}
function tab(t){document.getElementById('tabReg').classList.add('hidden');document.getElementById('tabList').classList.add('hidden');document.getElementById('tabAdmin').classList.add('hidden');document.getElementById('b1').classList.remove('active');document.getElementById('b2').classList.remove('active');document.getElementById('b3').classList.remove('active');if(t=='reg'){document.getElementById('tabReg').classList.remove('hidden');document.getElementById('b1').classList.add('active');}if(t=='list'){document.getElementById('tabList').classList.remove('hidden');document.getElementById('b2').classList.add('active');showList();}if(t=='admin'){document.getElementById('tabAdmin').classList.remove('hidden');document.getElementById('b3').classList.add('active');}}
function showError(m){var e=document.getElementById('err');e.style.display='block';e.textContent='❌ '+m;setTimeout(function(){e.style.display='none'},4000)}
function register(){var n=document.getElementById('name').value.trim();var mob=document.getElementById('mobile').value.trim();var dist=document.getElementById('district').value;var tal=document.getElementById('taluk').value;var thog=document.getElementById('thoguthi').value;var blood=document.getElementById('blood').value;var addr=document.getElementById('address').value.trim();if(!PHOTO){showError('PHOTO SELECT!');return;}if(!n){showError('NAME!');return;}if(mob.length!=10){showError('MOBILE 10 DIGIT!');return;}if(!dist){showError('DISTRICT!');return;}if(!tal){showError('TALUK!');return;}if(!thog){showError('THOGUTHI!');return;}if(!blood){showError('BLOOD!');return;}if(!addr){showError('ADDRESS!');return;}document.getElementById('btn').textContent='⏳ REGISTERING...';setTimeout(function(){var id='TPK-'+(1000+getM().length+1)+'-'+Math.floor(Math.random()*90+10);var obj={id:id,name:n,fname:document.getElementById('fname').value,mobile:mob,district:dist,taluk:tal,thoguthi:thog,blood:blood,address:addr,photo:PHOTO,date:new Date().toLocaleDateString()};var arr=getM();arr.unshift(obj);saveM(arr);CUR=obj;document.getElementById('name').value='';document.getElementById('mobile').value='';document.getElementById('address').value='';PHOTO='';document.getElementById('photoPrev').classList.add('hidden');document.getElementById('btn').textContent='✅ REGISTER NOW';updateCount();makeCard(obj);alert('REGISTERED! '+id);},300);}
function makeCard(m){CUR=m;var html='<div class="id-card" id="cardPrint"><div style="background:#b91c1c;padding:8px;display:flex;align-items:center;gap:8px;border-bottom:4px solid #facc15"><div style="width:44px;height:44px;border-radius:50%;background:#fde047;color:#b91c1c;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid #fff">TPK</div><div style="flex:1"><div style="color:#fde047;font-weight:900;font-size:11px">TAMILAR PURACHI KALAKAM</div><div style="color:#fef9c3;font-size:8px;font-weight:900">'+m.district.toUpperCase()+' / '+m.thoguthi.toUpperCase()+'</div></div><div style="background:#fde047;color:#b91c1c;padding:4px 6px;border-radius:6px;font-weight:900;font-size:8px">'+m.id+'</div></div><div style="background:#fef9c3;padding:8px;display:flex;gap:8px"><div style="width:110px"><img src="'+m.photo+'" style="width:100%;height:132px;object-fit:cover;border:2px solid #b91c1c;border-radius:10px"><div style="margin-top:4px;background:#b91c1c;color:#fde047;text-align:center;padding:3px;border-radius:6px;font-weight:900;font-size:8px">'+m.id+'</div></div><div style="flex:1;background:#fff;border:2px solid #facc15;border-radius:10px;padding:6px;font-size:10px;line-height:1.6"><div><b>NAME:</b> '+m.name.toUpperCase()+'</div><div><b>FATHER:</b> '+m.fname.toUpperCase()+'</div><div><b>MOBILE:</b> '+m.mobile+'</div><div><b>THOGUTHI:</b> '+m.thoguthi+'</div><div><b>TALUK:</b> '+m.taluk+'</div><div><b>DISTRICT:</b> '+m.district+'</div><div><b>BLOOD:</b> '+m.blood+'</div><div><b>ADDR:</b> '+m.address+'</div></div></div><div style="background:#b91c1c;color:#fde047;text-align:center;padding:4px;font-weight:900;font-size:7px">TPK REGISTERED</div></div>';var btns='<div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px"><button onclick="window.print()" style="padding:12px;background:#111;color:#fde047;border:none;border-radius:10px;font-weight:900">PRINT</button><button onclick="downloadImg()" style="padding:12px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-weight:900">DOWNLOAD</button></div>';document.getElementById('out').innerHTML=html+btns;}
function downloadImg(){var card=document.getElementById('cardPrint');html2canvas(card,{scale:3}).then(function(canvas){var url=canvas.toDataURL('image/png');var a=document.createElement('a');a.href=url;a.download='TPK_'+CUR.id+'.png';a.click();});}
function showList(){var arr=getM();var box=document.getElementById('listBox');if(arr.length==0){box.innerHTML='<div style="text-align:center;padding:30px">NO MEMBERS</div>';return;}box.innerHTML=arr.map(function(m){return '<div style="display:flex;gap:10px;padding:10px;border:2px solid #fde047;border-radius:10px;margin-bottom:6px;background:#fff"><img src="'+m.photo+'" style="width:48px;height:60px;object-fit:cover;border-radius:8px"><div><div style="font-weight:900">'+m.name+' - '+m.thoguthi+'</div><div style="font-size:10px">'+m.id+' | '+m.district+' | '+m.blood+'</div></div></div>';}).join('');updateCount();}
function login(){var p=document.getElementById('pass').value;if(p=='TPK2026'||p=='velmurugan'||p=='admin'){document.getElementById('loginBox').classList.add('hidden');document.getElementById('adminBox').classList.remove('hidden');document.getElementById('adminList').innerHTML=getM().map(function(m){return '<div style="padding:6px;border-bottom:1px solid #ccc">'+m.id+' - '+m.name+' - '+m.district+'</div>';}).join('');}else{alert('WRONG');}}
updateCount();
</script></body></html>
