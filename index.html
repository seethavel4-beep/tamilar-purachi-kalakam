<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPK - Tamilar Puratchi Kalakam</title>
<style>
/* MAIN BODY */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  background:#000;
  color:#fff;
  font-family: Arial, sans-serif;
  overflow-x:hidden;
  width:100%;
}
/* HEADER */
.header{
  text-align:center;
  padding:15px 10px;
  width:100%;
}
/* LOGO CIRCLE */
.logo{
  width:130px;
  height:130px;
  margin:0 auto 12px;
  border-radius:50%;
  overflow:hidden;
  border:4px solid #FFD700;
  box-shadow:0 0 15px rgba(255,215,0,0.5);
  background:#fff;
}
.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
/* KODI FLAG */
.kodi{
  width:95%;
  max-width:380px;
  height:210px;
  margin:0 auto 12px;
  border:3px solid #FFD700;
  border-radius:10px;
  overflow:hidden;
  background:#111;
}
.kodi img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
/* TITLE */
.title{
  color:#FFD700;
  font-size:22px;
  font-weight:800;
}
.sub{
  color:#FFD700;
  font-size:14px;
  font-weight:700;
}
.office{
  font-size:11px;
  color:#aaa;
  margin-top:6px;
}
/* NAV BUTTONS */
.nav{
  display:flex;
  gap:8px;
  justify-content:center;
  padding:12px 8px;
  background:#111;
  flex-wrap:wrap;
}
.btn{
  padding:11px 14px;
  border:none;
  border-radius:8px;
  font-weight:800;
  font-size:13px;
  cursor:pointer;
}
.btn-r{
  background:#D90429;
  color:#fff;
}
.btn-y{
  background:#FFD700;
  color:#000;
}
.btn-o{
  background:#222;
  border:2px solid #FFD700;
  color:#fff;
}
/* CARD */
.card{
  background:#fff;
  color:#000;
  border-radius:16px;
  border:3px solid #FFD700;
  overflow:hidden;
  margin:10px 8px;
}
.head{
  background:#000;
  color:#FFD700;
  padding:12px;
  text-align:center;
  font-weight:700;
  font-size:14px;
}
.form{
  padding:12px;
}
label{
  font-weight:700;
  font-size:12px;
  display:block;
  margin-top:12px;
}
input{
  width:100%;
  padding:11px;
  border:2px solid #ddd;
  border-radius:8px;
  margin-top:4px;
  box-sizing:border-box;
  font-size:13px;
}
input:focus{
  border-color:#FFD700;
  outline:none;
}
.reg{
  width:100%;
  background:#D90429;
  color:#fff;
  padding:13px;
  border:none;
  border-radius:10px;
  font-weight:800;
  margin-top:16px;
  cursor:pointer;
  font-size:14px;
}
/* MEMBER LIST */
.member-item{
  background:#111;
  border:1px solid #333;
  border-left:4px solid #FFD700;
  padding:10px;
  margin:8px;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.member-item b{
  color:#FFD700;
  font-size:13px;
}
.del-btn{
  background:#D90429;
  color:#fff;
  border:none;
  padding:7px 14px;
  border-radius:6px;
  font-weight:700;
  cursor:pointer;
  font-size:12px;
}
.badge{
  background:#FFD700;
  color:#000;
  padding:2px 6px;
  border-radius:4px;
  font-size:10px;
  margin-left:6px;
}
</style>
</head>
<body>

<!-- HEADER LOGO KODI -->
<div class="header">
  <div class="logo">
    <img src="tpk-logo.jpg" alt="TPK Logo">
  </div>
  <div class="kodi">
    <img src="tpk-flag.jpg" alt="TPK Flag">
  </div>
  <div class="title">TAMILAR PURATCHI KALAKAM</div>
  <div class="sub">Tamilnadu</div>
  <div class="office">Office: 35, Aruppukottai, Virudhunagar - 626101</div>
</div>

<!-- NAV -->
<div class="nav">
  <button class="btn btn-r" onclick="show('reg')">📝 NEW REG</button>
  <button class="btn btn-y" onclick="show('members')">👥 MEMBERS (<span id="c">0</span>)</button>
  <button class="btn btn-o" onclick="show('admin')">🔐 ADMIN</button>
</div>

<!-- REGISTRATION FORM -->
<div id="regSec">
  <div class="card">
    <div class="head">MEMBER REGISTRATION - No Taluka No Cut</div>
    <div class="form">
      <label>பெயர் / Name *</label>
      <input id="name" type="text" placeholder="A.VELMURUGAN">
      <label>போன் நம்பர் / Phone *</label>
      <input id="phone" type="tel" placeholder="8489247911">
      <label>மாவட்டம் / District *</label>
      <input id="dist" type="text" placeholder="Virudhunagar">
      <label>தொகுதி / Thoguthi *</label>
      <input id="thog" type="text" placeholder="Aruppukottai">
      <label>Address</label>
      <input id="addr" type="text" placeholder="35,k.p.street">
      <button class="reg" onclick="register()">REGISTER & DOWNLOAD CARD</button>
      <div id="msg" style="text-align:center;margin-top:10px;font-size:12px"></div>
    </div>
  </div>
</div>

<!-- MEMBERS LIST -->
<div id="membersSec" style="display:none">
  <div class="card">
    <div class="head">👥 Members List - Delete Option</div>
    <div id="membersList" style="padding:10px"></div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminSec" style="display:none">
  <div class="card">
    <div class="head">🔐 ADMIN PANEL - Password: tpk2024</div>
    <div class="form">
      <label>Admin Password</label>
      <input type="password" id="adminPass" placeholder="tpk2024">
      <button class="reg" onclick="adminLogin()">LOGIN & VIEW ALL + DELETE</button>
      <div id="adminData" style="display:none;margin-top:12px"></div>
    </div>
  </div>
</div>

<script>
// LOAD MEMBERS FROM LOCAL STORAGE
let members=JSON.parse(localStorage.getItem('tpk_final_150')||'[]');
document.getElementById('c').innerText=members.length;

// SHOW SECTION FUNCTION
function show(s){
  document.getElementById('regSec').style.display=s=='reg'?'block':'none';
  document.getElementById('membersSec').style.display=s=='members'?'block':'none';
  document.getElementById('adminSec').style.display=s=='admin'?'block':'none';
  if(s=='members') load(false);
}

// REGISTER FUNCTION WITH DUPLICATE CHECK
function register(){
  let n=document.getElementById('name').value.trim();
  let p=document.getElementById('phone').value.trim();
  let dist=document.getElementById('dist').value.trim();
  let thog=document.getElementById('thog').value.trim();
  let addr=document.getElementById('addr').value.trim();
  
  if(!n||!p){
    alert('Name & Phone Required!');
    return;
  }
  
  // CHECK DUPLICATE PHONE
  let dupIndex=members.findIndex(m=>m.phone==p);
  if(dupIndex!=-1){
    let old=members[dupIndex];
    if(confirm('⚠️ DUPLICATE FOUND!\nPhone: '+p+'\nName: '+old.name+'\nID: '+old.id+'\n\nOru member rendu thadava vanthirukku!\nDelete old & add new?')){
      members.splice(dupIndex,1);
    }else{
      document.getElementById('msg').innerHTML='<span style=color:orange>Already Exists: '+old.id+'</span>';
      return;
    }
  }
  
  // CREATE NEW MEMBER
  let id='TPK'+Date.now().toString().slice(-6);
  let data={
    name:n,
    phone:p,
    dist:dist||'Virudhunagar',
    thog:thog||'Aruppukottai',
    addr:addr,
    id:id,
    date:new Date().toLocaleDateString()
  };
  
  members.push(data);
  localStorage.setItem('tpk_final_150',JSON.stringify(members));
  document.getElementById('c').innerText=members.length;
  document.getElementById('msg').innerHTML='<span style=color:green>✅ Registered ID: '+id+'</span>';
}

// LOAD MEMBERS WITH DELETE BUTTON
function load(isAdmin){
  let target=isAdmin?document.getElementById('adminData'):document.getElementById('membersList');
  if(isAdmin) target.style.display='block';
  
  if(members.length==0){
    target.innerHTML='<p style=color:#aaa;padding:10px;text-align:center>No members yet</p>';
    return;
  }
  
  let html=members.map((m,i)=>{
    return `<div class=member-item>
      <div><b>${m.name}</b><br><small style=color:#ccc>${m.phone} | ${m.id}</small><br><small style=color:#888>${m.date}</small></div>
      <button class=del-btn onclick="del(${i},${isAdmin})">🗑️ DELETE</button>
    </div>`;
  }).join('');
  
  if(isAdmin){
    target.innerHTML=`<h4 style=color:#FFD700>Total: ${members.length}</h4><div style=margin-top:10px>${html}</div><button class=reg style=background:#000;border:2px solid #FFD700;color:#FFD700;margin-top:15px onclick="clearAll()">DELETE ALL</button>`;
  }else{
    target.innerHTML=html;
  }
}

// DELETE MEMBER FUNCTION
function del(index,isAdmin){
  let m=members[index];
  if(confirm('🗑️ Delete?\nName: '+m.name+'\nPhone: '+m.phone+'\nID: '+m.id)){
    members.splice(index,1);
    localStorage.setItem('tpk_final_150',JSON.stringify(members));
    document.getElementById('c').innerText=members.length;
    load(isAdmin);
    if(isAdmin) load(true);
    alert('✅ Deleted: '+m.name);
  }
}

// ADMIN LOGIN
function adminLogin(){
  let pass=document.getElementById('adminPass').value;
  if(pass=='tpk2024'){
    load(true);
  }else{
    alert('Wrong Password! Use: tpk2024');
  }
}

// CLEAR ALL
function clearAll(){
  if(confirm('Delete All '+members.length+' members?') && confirm('Last Confirm?')){
    members=[];
    localStorage.setItem('tpk_final_150','[]');
    document.getElementById('c').innerText='0';
    load(true);
    alert('All Deleted');
  }
}
</script>
</body>
    </html>
